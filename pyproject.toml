[project]
name = "synth-research"
version = "0.1.0"
description = "AI-simulated user research with evidence-grounded personas and multi-model replication"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "litellm>=1.40",
    "instructor>=1.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "questionary>=2.1.1",
]

[project.scripts]
synth = "synth.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pyright>=1.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["B008"]  # typer.Option() in defaults is the standard Typer pattern

[tool.ruff.lint.per-file-ignores]
"src/synth/core/interview_guide.py" = ["E501"]  # long interview question strings are intentional
"src/synth/core/advocate.py" = ["E501"]  # long prompt strings are intentional
"src/synth/wizard/persona_wizard.py" = ["E501"]  # long prompt strings are intentional

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
